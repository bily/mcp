[project]
name = "time-server-mcp"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server providing current time in any IANA timezone and Unix timestamp."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marvis" }]
keywords = ["mcp", "model-context-protocol", "time", "fastmcp"]
dependencies = [
    "mcp>=1.2.0",
    "tzdata>=2024.1",
]

[project.scripts]
time-server-mcp = "time_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["time_server"]

[tool.hatch.build.targets.sdist]
include = ["time_server.py", "README.md", "pyproject.toml"]
